<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C1019">
<meta name="description" content="Play chess against bots while a coach pauses on your mistakes and gives less help as your rank rises.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<title>Dee Chess</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column like a phone app; the board is the hero, everything else stays quiet until the coach speaks. */
:root {
  /* "Midnight study": a deep quiet room, one warm light on the board. Single deliberate dark look. */
  --ink: #0C1019;
  --ink-raised: #141A28;
  --slate: #1D2538;
  --line: #2A3350;
  --text: #F2EEE6;
  --quiet: #9AA3B8;
  --gold: #E8B954;
  --gold-deep: #B8862B;
  --coral: #FF6B5E;
  --amber: #FFB547;
  --mint: #4FD8A4;
  --sq-light: #E9D7B7;
  --sq-dark: #9C7451;
  --hl-last: rgba(232, 185, 84, 0.42);
  --hl-sel: rgba(79, 216, 164, 0.45);
  --font-display: "Fraunces", "Georgia", "Times New Roman", serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.app {
  max-width: 520px;
  margin: 0 auto;
  height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen { height: 100%; display: flex; flex-direction: column; }
.scroll { overflow-y: auto; padding-block: 14px 32px; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.eyebrow { font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--quiet); font-weight: 600; }
.muted { color: var(--quiet); }
.tabnum { font-variant-numeric: tabular-nums; }

/* Header */
.topline { display: flex; align-items: center; gap: 12px; }
.wordmark { font-family: var(--font-display); font-size: 27px; font-weight: 600; }
.wordmark b { color: var(--gold); font-weight: 700; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; background: var(--slate); font-weight: 600; font-size: 13.5px; }
.spacer { flex: 1; }

/* Cards */
.card { background: var(--ink-raised); border: 1px solid var(--line); border-radius: 20px; padding: 18px; }
.rank-card { display: flex; gap: 18px; align-items: center; padding: 22px; border-color: rgba(232, 185, 84, 0.35); box-shadow: 0 0 40px -8px rgba(232, 185, 84, 0.22); }
.rank-card h2 { font-size: 31px; color: var(--gold); }
.rank-meta { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.rank-rating { font-size: 17px; font-weight: 600; }
.ladder { display: flex; gap: 6px; margin-top: 8px; }
.ladder span { width: 22px; height: 22px; border-radius: 7px; background: var(--slate); display: grid; place-items: center; opacity: 0.45; }
.ladder span.on { opacity: 1; background: rgba(232, 185, 84, 0.16); }
.ladder svg { width: 18px; height: 18px; }
.coach-style { display: flex; gap: 14px; align-items: flex-start; }
.sage-mark { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(232, 185, 84, 0.12); border: 1px solid rgba(232, 185, 84, 0.5); color: var(--gold); font-size: 16px; }
.coach-style b { display: block; font-size: 15.5px; margin-bottom: 2px; }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; border-radius: 18px; font-weight: 700; font-size: 17px; width: 100%; transition: transform 0.12s ease, filter 0.12s ease; }
.btn:active { transform: scale(0.98); }
.btn-gold { background: linear-gradient(180deg, #F0C766, var(--gold)); color: #1B1408; box-shadow: 0 8px 28px -10px rgba(232, 185, 84, 0.7); }
.btn-line { border: 1px solid var(--line); background: transparent; color: var(--text); min-height: 50px; font-size: 16px; font-weight: 600; }
.btn-mint { border: 1px solid rgba(79, 216, 164, 0.6); color: var(--mint); min-height: 48px; font-size: 15.5px; font-weight: 600; }
.btn-small { min-height: 48px; font-size: 15.5px; }

.section-title { font-family: var(--font-display); font-size: 20px; margin-top: 4px; }
.game-row { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-radius: 16px; background: var(--ink-raised); border: 1px solid var(--line); }
.game-row .res { font-weight: 700; width: 42px; }
.game-row .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty-note { padding: 16px; border-radius: 16px; border: 1px dashed var(--line); color: var(--quiet); text-align: center; }

/* Opponents */
.bar { display: flex; align-items: center; gap: 4px; padding-block: 8px; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; }
.icon-btn:hover { background: var(--slate); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--slate); padding: 4px; border-radius: 14px; gap: 4px; }
.seg button { padding: 10px; border-radius: 11px; font-weight: 600; color: var(--quiet); }
.seg button[aria-pressed="true"] { background: var(--ink-raised); color: var(--text); box-shadow: 0 1px 0 var(--line); }
.bot { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 20px; background: var(--ink-raised); border: 1px solid var(--line); text-align: left; width: 100%; transition: border-color 0.15s ease, transform 0.12s ease; }
.bot:active { transform: scale(0.99); }
.bot.match { border-color: rgba(232, 185, 84, 0.45); box-shadow: 0 0 32px -10px rgba(232, 185, 84, 0.35); }
.bot .av { width: 54px; height: 54px; border-radius: 16px; background: var(--slate); display: grid; place-items: center; font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--gold); flex: none; }
.bot .nm { font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.bot .rt { font-weight: 700; color: var(--gold); font-size: 18px; }
.bot .info { flex: 1; min-width: 0; }
.tag-match { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); font-weight: 700; }

/* Game */
.game-screen { gap: 6px; padding-bottom: 8px; }
.gbar { display: flex; align-items: center; gap: 4px; padding-top: 4px; }
.gbar .lbl { color: var(--quiet); font-size: 13.5px; }
.gbar .txt-btn { display: inline-flex; align-items: center; gap: 6px; color: var(--quiet); padding: 8px 10px; border-radius: 10px; font-size: 14px; }
.gbar .txt-btn:hover { background: var(--slate); }
.player { display: flex; align-items: center; gap: 12px; padding: 4px 2px; }
.player .av { width: 38px; height: 38px; border-radius: 11px; background: var(--slate); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; color: var(--gold); flex: none; }
.player .av svg { width: 30px; height: 30px; }
.player .nm { font-weight: 700; }
.player .sub { color: var(--quiet); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player .meta { flex: 1; min-width: 0; }
.captured { display: flex; align-items: center; min-height: 18px; }
.captured svg { width: 18px; height: 18px; margin-right: -5px; }
.captured .adv { margin-left: 9px; font-size: 12px; color: var(--quiet); font-weight: 600; }
.thinking { display: flex; align-items: center; gap: 8px; color: var(--quiet); font-size: 12.5px; opacity: 0; transition: opacity 0.2s ease; }
.thinking.on { opacity: 1; }
.dots i { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); margin-right: 3px; animation: blink 1s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: 0.15s; }
.dots i:nth-child(3) { animation-delay: 0.3s; }
@keyframes blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

.board-wrap { position: relative; width: min(100%, 58dvh, 520px); margin: 0 auto; aspect-ratio: 1; max-width: 100%; border-radius: 12px; box-shadow: 0 18px 50px -16px rgba(0, 0, 0, 0.7), 0 0 44px -14px rgba(232, 185, 84, 0.18); transition: box-shadow 0.3s ease; }
.board-wrap.paused { box-shadow: 0 18px 50px -16px rgba(0, 0, 0, 0.7), 0 0 50px -10px rgba(255, 107, 94, 0.32); }
.board { position: absolute; inset: 0; border-radius: 12px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.layer { position: absolute; inset: 0; }
.squares { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); transition: filter 0.35s ease; }
.sq { position: relative; }
.sq.l { background: var(--sq-light); }
.sq.d { background: var(--sq-dark); }
.coord { position: absolute; font-size: 10px; font-weight: 700; line-height: 1; pointer-events: none; }
.sq.l .coord { color: var(--sq-dark); }
.sq.d .coord { color: var(--sq-light); }
.coord.rk { top: 3px; left: 3px; }
.coord.fl { bottom: 3px; right: 4px; }
.hl { position: absolute; width: 12.5%; height: 12.5%; pointer-events: none; }
.hl.last { background: var(--hl-last); }
.hl.sel { background: var(--hl-sel); }
.hl.check { background: radial-gradient(circle, rgba(255, 70, 60, 0.95) 0%, rgba(255, 70, 60, 0.55) 35%, rgba(255, 70, 60, 0) 72%); }
.hl.dot::after { content: ""; position: absolute; left: 50%; top: 50%; width: 30%; height: 30%; transform: translate(-50%, -50%); border-radius: 50%; background: rgba(20, 26, 40, 0.32); }
.hl.cap::after { content: ""; position: absolute; inset: 4%; border-radius: 50%; border: 0.55vmin solid rgba(20, 26, 40, 0.34); border-width: max(3px, 0.6vmin); }
.pieces { transition: filter 0.35s ease; }
.pc { position: absolute; width: 12.5%; height: 12.5%; left: 0; top: 0; will-change: transform; pointer-events: none; }
.pc svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 2px 1.5px rgba(0, 0, 0, 0.28)); }
.pc.anim { transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.3, 1); }
.pc.fade-in { animation: pcIn 0.18s ease both; }
@keyframes pcIn { from { opacity: 0; } to { opacity: 1; } }
.pc.drag { z-index: 5; transition: none; }
.pc.drag svg { transform: scale(1.25); transform-origin: 50% 70%; filter: drop-shadow(0 8px 6px rgba(0, 0, 0, 0.35)); }
.board.dim .squares, .board.dim .pieces, .board.dim .hls { filter: brightness(0.6) saturate(0.85); }
.hls { transition: filter 0.35s ease; }
.overlay { pointer-events: none; overflow: visible; }
.overlay .arrow { animation: draw 0.45s ease-out both; }
@keyframes draw { from { stroke-dashoffset: 8; opacity: 0.2; } to { stroke-dashoffset: 0; opacity: 1; } }
.overlay .ring { animation: pulse 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.45; } }

.promo { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(12, 16, 25, 0.6); z-index: 8; border-radius: 12px; touch-action: manipulation; }
.promo-box { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px; background: var(--ink-raised); border: 1px solid rgba(232, 185, 84, 0.45); border-radius: 20px; box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.7); }
.promo .row { display: flex; gap: 8px; }
.promo .row button { width: 64px; height: 64px; border-radius: 14px; background: var(--slate); }
.promo .row button:active { background: rgba(232, 185, 84, 0.25); }
.promo .row button svg { width: 100%; height: 100%; }
.promo-cancel { color: var(--quiet); font-size: 14px; padding: 6px 14px; border-radius: 10px; }

.moves { display: flex; gap: 14px; overflow-x: auto; white-space: nowrap; padding: 4px 2px; scrollbar-width: none; font-size: 14px; font-weight: 500; min-height: 30px; }
.moves::-webkit-scrollbar { display: none; }
.moves .n { color: var(--quiet); }
.moves .flag { font-weight: 800; margin-left: 1px; }
.moves .flag.smart { color: var(--gold); }
.moves .flag.good { color: var(--mint); }
.moves .flag.fine { color: var(--quiet); }
.moves .flag.bad { color: var(--coral); }

.feed { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; margin-top: 4px; border-radius: 16px; background: var(--ink-raised); border: 1px solid var(--line); animation: fadeIn 0.25s ease both; }
.fl { display: flex; gap: 8px; align-items: baseline; font-size: 14px; line-height: 1.4; min-width: 0; }
.fl > span:last-child { min-width: 0; }
.verdict-chip, .who-chip { flex: none; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; letter-spacing: 0.02em; }
.verdict-chip.smart { background: rgba(232, 185, 84, 0.18); color: var(--gold); }
.verdict-chip.good { background: rgba(79, 216, 164, 0.15); color: var(--mint); }
.verdict-chip.fine { background: var(--slate); color: var(--quiet); }
.verdict-chip.bad { background: rgba(255, 107, 94, 0.15); color: var(--coral); }
.who-chip { background: var(--slate); color: var(--quiet); }
.fl.botline { color: var(--quiet); }
.fl.botline b { color: var(--text); }

.dock { flex: 1; min-height: 140px; display: flex; flex-direction: column; justify-content: flex-start; }
.status { margin: auto 0; text-align: center; color: var(--quiet); font-size: 15px; }
.coach { background: var(--ink-raised); border: 1px solid rgba(255, 107, 94, 0.42); border-radius: 22px; padding: 16px 18px 14px; box-shadow: 0 0 34px -10px rgba(255, 107, 94, 0.35); animation: rise 0.38s cubic-bezier(0.2, 0.9, 0.25, 1.15) both; display: flex; flex-direction: column; gap: 9px; }
@keyframes rise { from { transform: translateY(26px); opacity: 0; } to { transform: none; opacity: 1; } }
.coach .who { display: flex; align-items: center; gap: 6px; color: var(--gold); font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.cline { display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; line-height: 1.42; }
.cline .ic { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; margin-top: 1px; }
.cline.wrong { font-weight: 700; }
.cline.wrong .ic { background: rgba(255, 107, 94, 0.16); color: var(--coral); }
.cline.why .ic { background: rgba(255, 181, 71, 0.16); color: var(--amber); }
.cline.better .ic { background: rgba(79, 216, 164, 0.16); color: var(--mint); }
.coach .actions { display: flex; gap: 10px; margin-top: 4px; }
.coach.quiz { border-color: rgba(232, 185, 84, 0.5); box-shadow: 0 0 34px -10px rgba(232, 185, 84, 0.35); }
.cline.ask .ic { background: rgba(232, 185, 84, 0.16); color: var(--gold); }
.note { margin: 6px 0 0; padding: 12px 14px; border-radius: 16px; font-size: 14.5px; line-height: 1.4; }
.note.good { background: rgba(79, 216, 164, 0.1); border: 1px solid rgba(79, 216, 164, 0.35); }
.note.bad { background: rgba(232, 185, 84, 0.08); border: 1px solid rgba(232, 185, 84, 0.35); }
.board.tapmode { cursor: pointer; }
.board.tapmode .squares .sq:hover { box-shadow: inset 0 0 0 3px rgba(232, 185, 84, 0.7); }

/* Home extras */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--ink-raised); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--quiet); line-height: 1.3; }
.puz-card { display: flex; align-items: center; gap: 14px; }
.puz-card .count { flex: none; width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-family: var(--font-display); font-size: 24px; font-weight: 700; background: rgba(79, 216, 164, 0.12); color: var(--mint); border: 1px solid rgba(79, 216, 164, 0.4); }
.puz-card .count.zero { background: var(--slate); color: var(--quiet); border-color: var(--line); }
.puz-card .txt { flex: 1; min-width: 0; }
.puz-card .txt b { display: block; font-size: 15.5px; }
.puz-card .go { flex: none; padding: 10px 16px; border-radius: 12px; font-weight: 700; background: var(--mint); color: #08241A; }
.puz-card .go.ghost { background: transparent; color: var(--mint); border: 1px solid rgba(79, 216, 164, 0.5); }

/* Puzzle screen */
.puz-head { display: flex; flex-direction: column; gap: 2px; padding-block: 2px 6px; }
.puz-head h2 { font-size: 22px; }
.puz-dock { flex: 1; min-height: 130px; display: flex; flex-direction: column; gap: 10px; padding-top: 8px; }
.verdict { padding: 14px 16px; border-radius: 18px; font-size: 15.5px; line-height: 1.42; display: flex; flex-direction: column; gap: 10px; }
.verdict.good { background: rgba(79, 216, 164, 0.1); border: 1px solid rgba(79, 216, 164, 0.4); }
.verdict.bad { background: rgba(255, 107, 94, 0.08); border: 1px solid rgba(255, 107, 94, 0.4); }
.verdict.info { background: var(--ink-raised); border: 1px solid var(--line); }
.verdict .row { display: flex; gap: 10px; }
.verdict .row > * { flex: 1; }
.coach .actions > * { flex: 1; }

/* Overlays */
.scrim { position: fixed; inset: 0; background: rgba(5, 7, 12, 0.62); z-index: 40; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn 0.2s ease both; }
.scrim.center { align-items: center; padding: 20px; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.sheet { width: 100%; max-width: 520px; background: var(--ink-raised); border-radius: 28px 28px 0 0; border: 1px solid var(--line); border-bottom: 0; padding: 26px max(22px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; animation: sheetUp 0.35s cubic-bezier(0.2, 0.9, 0.25, 1) both; text-align: center; }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
.sheet h2 { font-size: 29px; }
.sheet .delta { font-size: 23px; font-weight: 700; }
.dialog { width: 100%; max-width: 380px; background: var(--ink-raised); border: 1px solid var(--line); border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.dialog h3 { font-size: 22px; }
.dialog .row { display: flex; gap: 10px; margin-top: 6px; }
.dialog .row > * { flex: 1; }
.btn-danger { border: 1px solid rgba(255, 107, 94, 0.55); color: var(--coral); min-height: 48px; font-weight: 600; }

.rankup { position: fixed; inset: 0; z-index: 60; background: radial-gradient(circle at 50% 38%, rgba(232, 185, 84, 0.22), var(--ink) 62%); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 28px max(24px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px)); gap: 14px; }
.rankup canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.morph { position: relative; width: 180px; height: 180px; }
.morph > * { position: absolute; inset: 0; transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.3, 0.8, 0.3, 1); }
.morph .from { opacity: 1; transform: scale(1); }
.morph .to { opacity: 0; transform: scale(0.65); }
.morph.go .from { opacity: 0; transform: scale(0.7); }
.morph.go .to { opacity: 1; transform: scale(1); }
.rankup .new { opacity: 0; transform: translateY(18px); transition: all 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.2) 0.9s; display: flex; flex-direction: column; gap: 10px; align-items: center; max-width: 34ch; }
.rankup.show .new { opacity: 1; transform: none; }
.rankup .new h2 { font-size: 50px; color: var(--gold); }
.rankup .cont { width: min(100%, 360px); opacity: 0; transition: opacity 0.5s ease 2s; margin-top: 20px; }
.rankup.show .cont { opacity: 1; }

.loading { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 14px; color: var(--quiet); text-align: center; max-width: 30ch; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--slate); border-top-color: var(--gold); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--slate); border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px; z-index: 70; font-size: 14px; max-width: calc(100% - 32px); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }

<script>
"use strict";
/* ===================================================================
   Dee Chess — play against an AI that coaches you, and gives less help
   as your rank rises. Engine: Stockfish (runs in your browser).
   =================================================================== */

const SF_URL = "https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js";
const START_FEN = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1";
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------------- Ranks ---------------- */
const RANKS = [
  { id: "initiate", name: "Initiate", piece: "p", min: 0, depth: "full", pauses: ["blunder"], tagline: "Every master started here. I'll show you what went wrong and what to play." },
  { id: "squire", name: "Squire", piece: "n", min: 800, depth: "full", pauses: ["blunder", "mistake"], tagline: "You stopped giving pieces away. Now I'll catch your mistakes too." },
  { id: "tactician", name: "Tactician", piece: "b", min: 1200, depth: "why", pauses: ["blunder", "mistake"], tagline: "From now on I'll tell you why. You find the answer." },
  { id: "strategist", name: "Strategist", piece: "r", min: 1500, depth: "why", pauses: ["blunder", "mistake", "inaccuracy"], tagline: "I'll be stricter now. Even small slips get flagged." },
  { id: "sovereign", name: "Sovereign", piece: "q", min: 1800, depth: "why", pauses: ["blunder", "mistake", "inaccuracy"], tagline: "You rule the board. One more step to the top." },
  { id: "dee_one", name: "Dee One", piece: "k", min: 2200, depth: "wrong", pauses: ["blunder", "mistake", "inaccuracy"], tagline: "The top. From here I only say “wrong”. The why is yours to find." },
];
const RANK_CUSHION = 50;
const rankById = (id) => RANKS.find((r) => r.id === id) || RANKS[0];
const rankIdx = (r) => RANKS.findIndex((x) => x.id === r.id);
function rankForRating(rating) { let res = RANKS[0]; for (const r of RANKS) if (rating >= r.min) res = r; return res; }
const nextRank = (r) => RANKS[rankIdx(r) + 1] || null;
function progressToNext(rating, rank) { const n = nextRank(rank); if (!n) return 1; return clamp((rating - rank.min) / (n.min - rank.min), 0, 1); }
function resolveRank(current, rating, gatePassed) {
  let i = rankIdx(current);
  while (i > 0 && rating < RANKS[i].min - RANK_CUSHION) i--;
  const earned = rankIdx(rankForRating(rating));
  if (earned > i && gatePassed) i = earned;
  return RANKS[i];
}
const givesBetterMove = (rank) => rank.depth === "full";
const explainsWhy = (rank) => rank.depth !== "wrong";

/* ---------------- Rating ---------------- */
const STARTING_RATING = 600;
const PLACEMENT_BOTS = [400, 600, 800];
const kFactor = (games) => (games < 20 ? 40 : 20);
const expectedScore = (p, o) => 1 / (1 + Math.pow(10, (o - p) / 400));
function updatedRating(rating, opponent, result, games) { return Math.max(100, Math.round(rating + kFactor(games) * (result - expectedScore(rating, opponent)))); }
function promotionGatePassed(blundersNewestFirst) {
  if (blundersNewestFirst.length < 10) return false;
  const last = blundersNewestFirst.slice(0, 10);
  return last.reduce((a, b) => a + b, 0) / 10 < 1;
}

/* ---------------- Move judging ---------------- */
const DROP = { inaccuracy: 7, mistake: 14, blunder: 22 };
function winChance(s) {
  if (s.mate != null) return s.mate > 0 ? 100 : 0;
  const c = clamp(s.cp, -1000, 1000);
  return 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * c)) - 1);
}
const flipScore = (s) => (s.mate != null ? { mate: -s.mate } : { cp: -s.cp });
function judgeMove(before, after) {
  const drop = winChance(before) - winChance(after);
  if (drop >= DROP.blunder) return "blunder";
  if (drop >= DROP.mistake) return "mistake";
  if (drop >= DROP.inaccuracy) return "inaccuracy";
  return null;
}
const SEV_SYMBOL = { inaccuracy: "?!", mistake: "?", blunder: "??" };

/* ---------------- UCI ---------------- */
function parseInfo(line) {
  if (!line.startsWith("info ")) return null;
  const t = line.split(/\s+/);
  let depth = 0, multipv = 1, score = null, pv = [];

class Engine {

/* ---------------- Board model (chess.js underneath) ---------------- */
const VALUE = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
const NOUN = { p: "pawn", n: "knight", b: "bishop", r: "rook", q: "queen", k: "king" };

const uciTo = (u) => u.slice(2, 4);

class Pos {
  constructor(fen) { this.g = new Chess(fen); this.fen = this.g.fen(); this.turn = this.g.turn(); this._pieces = null; }

  get fullmoves() { return parseInt(this.fen.split(" ")[5], 10) || 1; }
  get halfmoves() { return parseInt(this.fen.split(" ")[4], 10) || 0; }

    if (this._pieces) return this._pieces;
    const out = {}, b = this.g.board();
    for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) { const p = b[r][f]; if (p) out[sqAt(f, 7 - r)] = { side: p.color, kind: p.type }; }

  }
  pieceAt(sq) { return this.pieces()[sq] || null; }
  _m(uci) { return { from: uciFrom(uci), to: uciTo(uci), promotion: uci[4] || "q" }; }

  san(uci) { const g = new Chess(this.fen); const m = g.move(this._m(uci)); if (!m) throw new Error("Illegal move " + uci); return m.san; }
  legal() { return this.g.moves({ verbose: true }); }
  get isCheck() { return this.g.in_check(); }
  get isCheckmate() { return this.g.in_checkmate(); }
  get isStalemate() { return this.g.in_stalemate(); }
  get isInsufficient() { return this.g.insufficient_material(); }

  attackers(square, by) {
    const out = [];
    for (const [sq, p] of Object.entries(this.pieces())) if (p.side === by && attacksFrom(this, sq).includes(square)) out.push(sq);
    return out;

function attacksFrom(b, from) {
  const p = b.pieceAt(from);
  if (!p) return [];
  const f = fileOf(from), r = rankOf(from), out = [];
  const step = (df, dr) => { if (onBoard(f + df, r + dr)) out.push(sqAt(f + df, r + dr)); };
  const ray = (df, dr) => { let nf = f + df, nr = r + dr; while (onBoard(nf, nr)) { const s = sqAt(nf, nr); out.push(s); if (b.pieceAt(s)) break; nf += df; nr += dr; } };
  const D = [[1, 1], [1, -1], [-1, 1], [-1, -1]], S = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  switch (p.kind) {
    case "p": { const d = p.side === "w" ? 1 : -1; step(-1, d); step(1, d); break; }
    case "n": for (const [a, c] of [[1, 2], [2, 1], [2, -1], [1, -2], [-1, -2], [-2, -1], [-2, 1], [-1, 2]]) step(a, c); break;
    case "k": for (let a = -1; a <= 1; a++) for (let c = -1; c <= 1; c++) if (a || c) step(a, c); break;
    case "b": for (const [a, c] of D) ray(a, c); break;
    case "r": for (const [a, c] of S) ray(a, c); break;
    case "q": for (const [a, c] of [...D, ...S]) ray(a, c); break;

const material = (b, side) => Object.values(b.pieces()).filter((p) => p.side === side).reduce((s, p) => s + VALUE[p.kind], 0);
const balance = (b, side) => material(b, side) - material(b, opp(side));

/* Pieces of [victim] that can be won: attacked and undefended, or attacked
   by something cheaper. A king only counts as an attacker on undefended

function threatenedSquares(b, victim) {
  const them = opp(victim), out = [];
  for (const [sq, p] of Object.entries(b.pieces())) {

    const defenders = b.attackers(sq, victim);
    const attackers = b.attackers(sq, them).filter((s) => b.pieceAt(s).kind !== "k" || defenders.length === 0);
    if (!attackers.length) continue;
    const cheapest = Math.min(...attackers.map((s) => (b.pieceAt(s).kind === "k" ? 100 : VALUE[b.pieceAt(s).kind])));

  const old = new Set(threatenedSquares(before, victim));

/* ---------------- Mistake detectors ---------------- */
const MT_LABEL = {
  hungPiece: "Hung a piece", movedIntoCapture: "Moved into capture", ignoredThreat: "Ignored a threat",
  allowedFork: "Allowed a fork", pin: "Walked into a pin", skewer: "Walked into a skewer",
  allowedMate: "Allowed checkmate", backRank: "Back-rank weakness", missedWin: "Missed a win",
  badTrade: "Bad trade", earlyQueen: "Early queen", kingInCentre: "King left in the centre",
  weakenedShelter: "Weakened king shelter", stalemate: "Stalemate blunder", generic: "Positional slip",
};
function playLine(start, moves, max) { const out = []; let b = start; for (const m of moves.slice(0, max)) { try { b = b.play(m); out.push(b); } catch (e) { break; } } return out; }

function findPinOrSkewer(b, from, victim) {
  const p = b.pieceAt(from);
  if (!p || !["b", "r", "q"].includes(p.kind)) return null;
  const D = [[1, 1], [1, -1], [-1, 1], [-1, -1]], S = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const dirs = p.kind === "b" ? D : p.kind === "r" ? S : [...D, ...S];
  for (const [df, dr] of dirs) {
    let f = fileOf(from) + df, r = rankOf(from) + dr, first = null, firstSq = null;
    while (onBoard(f, r)) {
      const s = sqAt(f, r), q = b.pieceAt(s);

        if (!first) { first = q; firstSq = s; }
        else {

          if (fv > bv) return { square: firstSq, front: first.kind, back: q.kind, skewer: true };

function detectMistake({ before, move, after, severity, bestLine, replyLine }) {
  const me = before.turn, them = opp(me);

  const replyUci = replyLine && replyLine.moves[0];
  const replySan = replyUci ? safeSan(after, replyUci) : null;
  const replyBoards = replyLine ? playLine(after, replyLine.moves, 6) : [];
  const end = replyBoards.length ? replyBoards[replyBoards.length - 1] : after;

  const captured = before.pieceAt(uciTo(move));

    type, severity, yourSan, yourUci: move, bestUci, bestSan, replyUci, replySan,
    materialLost: Math.max(0, lost), materialWon: 0, lineSan: line, ...extra,

  const rs = replyLine && replyLine.score;
  if (rs && rs.mate != null && rs.mate > 0) {
    const all = playLine(after, replyLine.moves, 40);
    const last = all[all.length - 1];
    const mateMove = all.length ? replyLine.moves[all.length - 1] : null;
    const kingSq = after.kingSquare(me), home = me === "w" ? 0 : 7;

  }

    const bs = bestLine.score;
    if (bs.mate != null && bs.mate > 0) return report("missedWin", { mateIn: bs.mate });
    const bb = playLine(before, bestLine.moves, 6);
    if (bb.length) {

    }

        .map((s) => [s, ar.pieceAt(s)])

  const takes = before.pieceAt(uciTo(best));
  if (takes && takes.side !== me && VALUE[takes.kind] >= 3) { r.betterReason = "it wins the " + NOUN[takes.kind]; return r; }
  if (r.square && r.piece) {
    const own = before.pieceAt(r.square);
    if (own && own.side === me) {
      if (uciFrom(best) === r.square) { r.betterReason = "it moves your " + NOUN[r.piece] + " to safety"; return r; }
      if (after.attackers(r.square, me).length > before.attackers(r.square, me).length) { r.betterReason = "it guards your " + NOUN[r.piece]; return r; }

/* ---------------- Live commentary (never stops the game) ---------------- */
/* What a move does, in plain words, from the mover's side. [me] is "your"
   for Dee, or the bot's name. Returns null if nothing stands out. */
function describeMove(before, uci, after, owner) {
  const mover = before.turn, other = opp(mover);
  const from = uciFrom(uci), to = uciTo(uci);
  const piece = before.pieceAt(from);
  if (!piece) return null;
  const captured = before.pieceAt(to);
  const yours = owner === "your";
  const poss = yours ? "your" : "their";
  if (after.isCheckmate) return "Checkmate!";
  if (uci.length === 5) return `promotes to a ${NOUN[uci[4]] || "queen"}`;
  if (piece.kind === "k" && Math.abs(fileOf(to) - fileOf(from)) === 2) return `castles. The king is safe and the rook joins the game`;
  if (before.isCheck) return captured ? `gets out of check by taking the ${NOUN[captured.kind]}` : "gets out of check";
  if (captured) {
    const recapturable = after.attackers(to, other).length > 0;
    if (!recapturable) return `wins a ${NOUN[captured.kind]} for free`;
    if (VALUE[captured.kind] > VALUE[piece.kind]) return `wins material: ${NOUN[piece.kind]} takes ${NOUN[captured.kind]}`;
    return `trades ${NOUN[piece.kind]} for ${NOUN[captured.kind]}`;
  }
  const dangerBefore = threatenedSquares(before, mover);
  if (dangerBefore.includes(from) && !threatenedSquares(after, mover).includes(to)) return `moves ${poss} ${NOUN[piece.kind]} out of danger`;
  const stillThere = dangerBefore.filter((sq) => sq !== from && !threatenedSquares(after, mover).includes(sq));
  if (stillThere.length) return `protects ${poss} ${NOUN[before.pieceAt(stillThere[0]).kind]} on ${stillThere[0]}`;
  if (after.isCheck) return "gives check";
  const newTargets = threatenedSquares(after, other).filter((sq) => !threatenedSquares(before, other).includes(sq));
  if (newTargets.length >= 2) return `attacks two pieces at once (${newTargets.map((s) => NOUN[after.pieceAt(s).kind]).join(" and ")})`;
  if (newTargets.length === 1) return `attacks the ${NOUN[after.pieceAt(newTargets[0]).kind]} on ${newTargets[0]}`;
  const home = mover === "w" ? 0 : 7;
  if ((piece.kind === "n" || piece.kind === "b") && rankOf(from) === home && before.fullmoves <= 12) return `develops ${poss} ${NOUN[piece.kind]}`;
  if (piece.kind === "p" && (fileOf(from) === 3 || fileOf(from) === 4) && before.fullmoves <= 10) return "claims space in the centre";
  if (piece.kind === "q" && before.fullmoves <= 6) return "brings the queen out early";
  return null;
}

/* Rates a move Dee played (that the coach didn't stop). */
function rateMove({ before, uci, after, bestLine, replyLine, rank, oppName }) {
  const legalCount = before.legal().length;

/* ---------------- The coach's words ---------------- */
function whyLine(r, oppName) {

    case "movedIntoCapture": return `Your ${p} went to ${sq}, where ${oppName} can win it with ${reply}.`;
    case "ignoredThreat": return `${oppName} was already attacking your ${p} on ${sq}. Your move didn't deal with it, so ${reply} wins it.`;
    case "allowedFork": return `${oppName} can play ${reply}, attacking your ${p} and your ${p2} at the same time. You can only save one.`;
    case "pin": return `After ${reply}, your ${p} is pinned to your ${p2}. If the ${p} moves, your ${p2} is lost.`;
    case "skewer": return `After ${reply}, your ${p} has to move, and your ${p2} behind it is lost.`;
    case "allowedMate": return r.mateIn === 1 ? `This allows checkmate: ${reply}. Always check your king's escape squares.` : `This lets ${oppName} force checkmate: ${line}… Watch your king's safety.`;
    case "backRank": return `Your king is trapped on the back rank behind its own pawns. ${oppName} can checkmate with ${line}.`;
    case "missedWin": return r.mateIn != null ? "You had a checkmate here! Before every move, look at checks first." : `You had a move that wins ${r.materialWon} points of material. Look for checks, captures and threats.`;
    case "badTrade": return `You gave your ${p} (${VALUE[r.piece]}) for a ${p2} (${VALUE[r.piece2]}). After ${reply} you lose ${VALUE[r.piece] - VALUE[r.piece2]} points.`;
    case "earlyQueen": return `Your queen came out too early. ${oppName} can chase it with ${reply} and develop at the same time.`;
    case "kingInCentre": return `Your king is still in the centre with open lines. ${oppName} can go after it with ${reply}.`;
    case "weakenedShelter": return `That pawn move opens a path to your king. ${oppName} can use it with ${reply}.`;
    case "stalemate": return `Careful, that's stalemate! ${oppName} has no legal moves, so the game is a draw even though you were winning.`;
    default: {

      if (r.severity === "inaccuracy") return `This lets ${oppName} improve their position with ${reply}.`;
      if (r.severity === "mistake") return `This gives ${oppName} a clearly better position after ${reply}.`;
      return `This gives ${oppName} a much better position after ${reply}.`;
    }
  }
}
function coachSays(r, rank, oppName, attempt) {

  const sev = { blunder: "That's a blunder.", mistake: "That's a mistake.", inaccuracy: "That's an inaccuracy." }[r.severity];

    const rect = this.board.getBoundingClientRect();
    const x = Math.floor(((cx - rect.left) / rect.width) * 8), y = Math.floor(((cy - rect.top) / rect.height) * 8);
    if (x < 0 || x > 7 || y < 0 || y > 7) return null;
    return this.orientation === "w" ? sqAt(x, 7 - y) : sqAt(7 - x, y);
  }
  drawSquares() {
    let html = "";
    for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
      const f = this.orientation === "w" ? x : 7 - x, r = this.orientation === "w" ? 7 - y : y;
      const light = (f + r) % 2 === 1;
      let c = "";
      if (x === 0) c += `<span class="coord rk">${r + 1}</span>`;
      if (y === 7) c += `<span class="coord fl">${String.fromCharCode(97 + f)}</span>`;
      html += `<div class="sq ${light ? "l" : "d"}">${c}</div>`;
    }
    this.sqLayer.innerHTML = html;
  }
  setOrientation(o) { this.orientation = o; this.drawSquares(); this.els.forEach((el, sq) => this.place(el, sq)); }
  place(el, sq) { const [x, y] = this.xy(sq); el.style.transform = `translate(${x * 100}%, ${y * 100}%)`; }
  render(pos, { animate = true, lastMove = null, interactive = false, mySide = "w", dim = false, shapes = [], tapMode = false } = {}) {
    const prev = this.pos ? this.pos.pieces() : {};
    const next = pos.pieces();
    this.pos = pos;
    this.interactive = interactive;
    this.tapMode = tapMode;
    this.board.classList.toggle("tapmode", tapMode);
    this.mySide = mySide;
    if (!interactive) this.sel = null;
    const code = (p) => (p ? p.side + p.kind : "");
    const newEls = new Map();
    const used = new Set();
    for (const [sq, p] of Object.entries(next)) if (code(prev[sq]) === code(p) && this.els.has(sq)) { newEls.set(sq, this.els.get(sq)); used.add(sq); }
    for (const [sq, p] of Object.entries(next)) {
      if (newEls.has(sq)) continue;
      const c = code(p);
      let src = null;
      for (const [s, el] of this.els) if (!used.has(s) && code(prev[s]) === c && code(next[s]) !== c) { src = s; break; }
      if (src) {
        const el = this.els.get(src); used.add(src);
        el.classList.toggle("anim", animate);
        this.place(el, sq);
        newEls.set(sq, el);
      } else {
        const el = document.createElement("div");
        el.className = "pc" + (animate ? " fade-in" : "");
        el.innerHTML = pieceSvg(p.side, p.kind);
        this.place(el, sq);
        this.pcLayer.appendChild(el);
        newEls.set(sq, el);
      }
    }
    for (const [s, el] of this.els) if (!used.has(s) && ![...newEls.values()].includes(el)) el.remove();
    this.els = newEls;
    this.lastMove = lastMove;
    this.board.classList.toggle("dim", dim);
    this.shapes = shapes;
    this.legalMap = new Map();
    if (interactive) for (const m of pos.legal()) { if (!this.legalMap.has(m.from)) this.legalMap.set(m.from, []); this.legalMap.get(m.from).push(m); }
    this.drawHighlights();
    this.drawShapes();
  }
  drawHighlights() {
    let html = "";
    const box = (sq, cls) => { const [x, y] = this.xy(sq); return `<div class="hl ${cls}" style="left:${x * 12.5}%;top:${y * 12.5}%"></div>`; };
    if (this.lastMove) { html += box(uciFrom(this.lastMove), "last") + box(uciTo(this.lastMove), "last"); }
    if (this.pos && this.pos.isCheck) { const k = this.pos.kingSquare(this.pos.turn); if (k) html += box(k, "check"); }
    if (this.sel) {
      html += box(this.sel, "sel");
      for (const m of this.legalMap.get(this.sel) || []) html += box(m.to, this.pos.pieceAt(m.to) ? "cap" : "dot");
    }
    this.hlLayer.innerHTML = html;
  }
  drawShapes() {
    let svg = "";
    const c = (sq) => { const [x, y] = this.xy(sq); return [x + 0.5, y + 0.5]; };
    for (const s of this.shapes) {
      if (s.type === "ring") { const [x, y] = c(s.sq); svg += `<circle class="ring" cx="${x}" cy="${y}" r="0.44" fill="none" stroke="${s.color}" stroke-width="0.075"/>`; }
      if (s.type === "arrow") {
        const [x1, y1] = c(s.from), [x2, y2] = c(s.to);
        const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
        const sx = x1 + ux * 0.2, sy = y1 + uy * 0.2, ex = x2 - ux * 0.32, ey = y2 - uy * 0.32;
        svg += `<line class="arrow" x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${s.color}" stroke-width="0.17" stroke-linecap="round" stroke-dasharray="8" opacity="0.92" marker-end="url(#ah-${s.marker})"/>`;
      }
    }
    this.ov.innerHTML = svg;
  }
  isMine(sq) { const p = this.pos && this.pos.pieceAt(sq); return !!(p && p.side === this.mySide); }
  down(e) {
    if (this.tapMode && this.onTap) {
      const t = this.sqFromPoint(e.clientX, e.clientY);
      if (t) this.onTap(t);
      e.preventDefault();
      return;
    }
    if (!this.interactive || !this.pos) return;
    const sq = this.sqFromPoint(e.clientX, e.clientY);
    if (!sq) return;
    sound.ensure();
    if (this.sel && sq !== this.sel && (this.legalMap.get(this.sel) || []).some((m) => m.to === sq)) { this.tryMove(this.sel, sq); return; }
    if (this.isMine(sq) && this.legalMap.has(sq)) {
      const wasSel = this.sel === sq;
      this.sel = sq;
      this.drawHighlights();
      const el = this.els.get(sq);
      this.drag = { sq, el, x0: e.clientX, y0: e.clientY, moving: false, wasSel, id: e.pointerId };
      e.preventDefault();
    } else {
      this.sel = null;
      this.drawHighlights();
    }
  }
  moveDrag(e) {
    const d = this.drag;
    if (!d || e.pointerId !== d.id) return;
    if (!d.moving && Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 6) return;
    d.moving = true;
    const rect = this.board.getBoundingClientRect(), size = rect.width / 8;
    const x = e.clientX - rect.left - size / 2, y = e.clientY - rect.top - size / 2;
    d.el.classList.add("drag");
    d.el.classList.remove("anim");
    d.el.style.transform = `translate(${x}px, ${y}px)`;
  }
  up(e) {
    const d = this.drag;
    if (!d || e.pointerId !== d.id) return;
    this.drag = null;
    d.el.classList.remove("drag");
    if (!d.moving) {
      if (d.wasSel) { this.sel = null; this.drawHighlights(); }
      return;
    }
    const to = this.sqFromPoint(e.clientX, e.clientY);
    if (to && to !== d.sq && (this.legalMap.get(d.sq) || []).some((m) => m.to === to)) {
      d.el.classList.remove("anim");
      this.place(d.el, to);
      this.tryMove(d.sq, to, true);
    } else {
      d.el.classList.add("anim");
      this.place(d.el, d.sq);
    }
  }
  cancelDrag() { const d = this.drag; if (!d) return; this.drag = null; d.el.classList.remove("drag"); d.el.classList.add("anim"); this.place(d.el, d.sq); }
  tryMove(from, to, dropped = false) {
    const moves = (this.legalMap.get(from) || []).filter((m) => m.to === to);
    if (!moves.length) return;
    this.sel = null;
    if (moves.some((m) => m.promotion)) {
      const el = this.els.get(from);
      if (el && !dropped) { el.classList.add("anim"); this.place(el, to); }
      this.askPromotion(from, to);
      return;
    }
    this.onMove(from + to);
  }
  askPromotion(from, to) {
    // On phones, the same tap that reaches the last rank also fires a click
    // on whatever appears under the finger, so only the piece buttons and the
    // cancel button act, and only after a short delay.
    const side = this.mySide;
    const opened = performance.now();
    const div = document.createElement("div");
    div.className = "promo";
    div.innerHTML = `<div class="promo-box"><span class="eyebrow">Promote your pawn to</span><div class="row">${["q", "r", "b", "n"].map((k) => `<button data-k="${k}" aria-label="Promote to ${NOUN[k]}">${pieceSvg(side, k)}</button>`).join("")}</div><button class="promo-cancel" data-cancel="1">Cancel</button></div>`;
    const cancel = () => {
      div.remove();
      const el = this.els.get(from);
      if (el) { el.classList.add("anim"); this.place(el, from); }
      this.promoOpen = false;
      this.drawHighlights();
    };
    div.addEventListener("click", (e) => {
      if (performance.now() - opened < 350) return;
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.cancel) { cancel(); return; }
      div.remove();
      this.promoOpen = false;
      this.onMove(from + to + b.dataset.k);
    });
    this.promoOpen = true;
    this.wrap.appendChild(div);
  }
}

/* ---------------- UI ---------------- */
const app = $("#app");
let currentGame = null;
let currentBoard = null;

function rankEmblem(rank, progress, size = 104) {
  const r = 46, C = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 104 104" aria-hidden="true">
    <circle cx="52" cy="52" r="${r}" fill="none" stroke="var(--slate)" stroke-width="6"/>
    <circle cx="52" cy="52" r="${r}" fill="none" stroke="url(#goldg)" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - progress)}" transform="rotate(-90 52 52)" style="transition: stroke-dashoffset 1s ease"/>
    <use href="#g-${rank.piece}" x="22" y="20" width="60" height="60"/>
  </svg>`;
}

function showHome() {
  teardownGame();
  const d = Profile.data, rank = Profile.rank, next = nextRank(rank);
  const style = {
    full: ["Full help", "On a bad move I pause, explain why, and show you a better move."],
    why: ["Why only", "On a bad move I pause and explain why. You find the better move."],
    wrong: ["Silent master", "I only tell you a move was wrong."],
  }[rank.depth];
  const results = d.history.slice(0, 6).map((g) => {
    const [lbl, col] = g.result === 1 ? ["Won", "var(--mint)"] : g.result === 0 ? ["Lost", "var(--coral)"] : ["Draw", "var(--quiet)"];
    const delta = g.after - g.before;
    return `<div class="game-row"><span class="res" style="color:${col}">${lbl}</span><span class="who">vs ${esc(g.bot)} <span class="muted">(${g.botRating})${g.rated ? "" : " · casual"}</span></span><span class="tabnum" style="color:${delta >= 0 ? "var(--gold)" : "var(--coral)"};font-weight:600">${delta === 0 ? "—" : (delta > 0 ? "+" : "") + delta}</span></div>`;
  }).join("");
  const ladder = RANKS.map((r) => `<span class="${rankIdx(r) <= rankIdx(rank) ? "on" : ""}" title="${r.name}"><svg viewBox="0 0 1 1"><use href="#g-${r.piece}" width="1" height="1"/></svg></span>`).join("");
  app.innerHTML = `
  <section class="screen"><div class="scroll">
    <div class="topline">
      <div class="wordmark">Dee <b>Chess</b></div><div class="spacer"></div>
      ${d.streak > 0 ? `<span class="chip" title="Days in a row">🔥 <span class="tabnum">${d.streak}</span></span>` : ""}
    </div>
    <div class="card rank-card">
      ${rankEmblem(rank, Profile.inPlacement ? 0 : progressToNext(d.rating, rank))}
      <div class="rank-meta">
        <span class="eyebrow">Your rank</span>
        <h2>${rank.name}</h2>
        <span class="rank-rating tabnum">${Profile.inPlacement ? `Placement · ${d.placementLeft} ${d.placementLeft === 1 ? "game" : "games"} left` : `${d.rating} rating`}</span>
        <span class="muted">${next ? `Next: ${next.name} at ${next.min}` : "Top rank reached"}</span>
        <div class="ladder" aria-label="Rank ladder">${ladder}</div>
      </div>
    </div>
    <div class="card coach-style">
      <div class="sage-mark">✦</div>
      <div><b>Coach: ${style[0]}</b><span class="muted">${style[1]}</span></div>
    </div>
    <button class="btn btn-gold" id="play">${Profile.inPlacement ? "Play placement game" : "Play"}</button>
    ${puzzleCard()}
    ${statsRow()}
    <h3 class="section-title">Recent games</h3>
    ${results || `<div class="empty-note">Your games will show up here. Start with a placement game against Kemi.</div>`}
  </div></section>`;
  $("#play").onclick = showOpponents;
  const pz = $("#puz-go");
  if (pz) pz.onclick = () => {
    const due = Profile.duePuzzles();
    if (due.length) showPuzzles(due, false);
    else showPuzzles(Profile.openPuzzles().slice(0, 10), true);
  };
}

function puzzleCard() {
  const due = Profile.duePuzzles().length, open = Profile.openPuzzles().length;
  const mastered = Profile.data.puzzles.length - open;
  if (!open && !mastered) {
    return `<div class="card puz-card"><span class="count zero">0</span><div class="txt"><b>Puzzles from your mistakes</b><span class="muted">Every time Sage stops you, that position comes back here the next day for you to solve.</span></div></div>`;
  }
  if (due) {
    return `<div class="card puz-card"><span class="count">${due}</span><div class="txt"><b>${due === 1 ? "Puzzle" : "Puzzles"} due today</b><span class="muted">Positions where you went wrong. Find the move you missed.</span></div><button class="go" id="puz-go">Solve</button></div>`;
  }
  return `<div class="card puz-card"><span class="count zero">0</span><div class="txt"><b>All caught up</b><span class="muted">${open ? `${open} coming back over the next days.` : ""} ${mastered ? `${mastered} mastered.` : ""}</span></div>${open ? `<button class="go ghost" id="puz-go">Practise</button>` : ""}</div>`;
}

function statsRow() {
  const d = Profile.data;
  if (!d.history.length && !d.threats.asked) return "";
  const bpg = Profile.blundersPerGame();
  const spot = d.threats.asked ? Math.round((100 * d.threats.spotted) / d.threats.asked) + "%" : "—";
  return `<div class="stats">
    <div class="stat"><b>${bpg == null ? "—" : bpg.toFixed(1)}</b><span>blunders per game, last 10</span></div>
    <div class="stat"><b>${spot}</b><span>threats spotted${d.threats.asked ? ` (${d.threats.spotted}/${d.threats.asked})` : ""}</span></div>
    <div class="stat"><b>${d.puzzles.filter((p) => p.mastered).length}</b><span>mistakes mastered</span></div>
  </div>`;
}

function showOpponents() {
  let rated = true;
  const draw = () => {
    const match = Profile.nextOpponent();
    const card = (b, isMatch, ratedGame) => `<button class="bot ${isMatch ? "match" : ""}" data-id="${b.id}" data-rated="${ratedGame}">
      <span class="av">${b.name[0]}</span>
      <span class="info"><span class="nm">${b.name}</span><br><span class="muted">${b.personality}</span>${isMatch ? `<br><span class="tag-match">Your match</span>` : ""}</span>
      <span class="rt tabnum">${b.rating}</span></button>`;
    app.innerHTML = `<section class="screen">
      <div class="bar"><button class="icon-btn" id="back" aria-label="Back">←</button><h2 style="font-size:22px">Choose opponent</h2></div>
      <div class="scroll" style="padding-top:4px">
      ${Profile.inPlacement
        ? `<p class="muted" style="margin:0">First, ${Profile.data.placementLeft} placement ${Profile.data.placementLeft === 1 ? "game" : "games"} to find your level.</p>${card(match, true, true)}`
        : `<div class="seg" role="group" aria-label="Game type"><button aria-pressed="${rated}" data-seg="1">Rated</button><button aria-pressed="${!rated}" data-seg="0">Casual</button></div>
           <p class="muted" style="margin:0">${rated ? "Rated games match you with a bot near your rating." : "Casual games never change your rating."}</p>
           ${rated ? card(match, true, true) : BOTS.map((b) => card(b, b.id === match.id, false)).join("")}`}
      </div></section>`;
    $("#back").onclick = showHome;
    app.querySelectorAll("[data-seg]").forEach((b) => (b.onclick = () => { rated = b.dataset.seg === "1"; draw(); }));
    app.querySelectorAll(".bot").forEach((b) => (b.onclick = () => startGame(BOTS.find((x) => x.id === b.dataset.id), b.dataset.rated === "true")));
  };
  draw();
}

/* Puzzles from your own mistakes. [practice] = don't change the schedule. */
function showPuzzles(list, practice) {
  teardownGame();
  if (!list.length) { showHome(); return; }
  let i = 0, solvedFirst = 0, pz, pos, firstTry, done, bestScore, engine = null;
  app.innerHTML = `<section class="screen game-screen">
    <div class="gbar"><button class="icon-btn" id="pback" aria-label="Back">←</button><span class="lbl" id="pcount"></span></div>
    <div class="puz-head"><span class="eyebrow" id="pmeta"></span><h2 id="ptitle"></h2></div>
    <div class="board-wrap" id="bw"></div>
    <div class="puz-dock" id="pdock"></div>
  </section>`;
  $("#pback").onclick = showHome;
  Engine.start().then((e) => { engine = e; }).catch(() => {});
  const board = new BoardView($("#bw"), { onMove: (uci) => onMove(uci) });
  currentBoard = board;
  const dock = (html) => { $("#pdock").innerHTML = html; };
  const grade = () => { if (!practice && pz.id) Profile.gradePuzzle(pz.id, firstTry); if (firstTry) solvedFirst++; };
  const nextBtn = () => (i + 1 < list.length ? `<button class="btn btn-gold btn-small" id="pnext">Next puzzle</button>` : `<button class="btn btn-gold btn-small" id="pnext">Finish</button>`);
  const wireNext = () => { $("#pnext").onclick = () => { if (i + 1 < list.length) { i++; load(); } else finish(); }; };
  function load() {
    pz = list[i]; pos = new Pos(pz.fen); firstTry = true; done = false; bestScore = null;
    board.setOrientation(pz.side);
    board.render(pos, { animate: false, interactive: true, mySide: pz.side });
    $("#pcount").textContent = `Puzzle ${i + 1} of ${list.length}${practice ? " · practice" : ""}`;
    $("#pmeta").textContent = `vs ${pz.bot} · ${MT_LABEL[pz.type] || "Mistake"}`;
    $("#ptitle").textContent = `Find the best move for ${pz.side === "w" ? "White" : "Black"}`;
    dock(`<div class="verdict info">You went wrong in this position before. What should you have played?</div>`);
  }
  async function onMove(uci) {
    if (done) return;
    const after = pos.play(uci);
    sound.move(!!pos.pieceAt(uciTo(uci)));
    board.render(after, { animate: true, lastMove: uci, interactive: false, mySide: pz.side });
    let ok = uci.slice(0, 4) === pz.solution.slice(0, 4) || after.isCheckmate;
    if (!ok && engine) {
      dock(`<div class="verdict info">Sage is checking your move…</div>`);
      try {
        if (!bestScore) { const a = await engine.judge(pos.fen); bestScore = a.lines[0] && a.lines[0].score; }
        const r = await engine.judge(after.fen);
        const s = r.lines[0] && r.lines[0].score;
        if (bestScore && s && judgeMove(bestScore, flipScore(s)) === null) ok = true;
      } catch (e) {}
    }
    const solSan = safeSan(pos, pz.solution);
    if (ok) {
      done = true; grade(); buzz(15);
      const same = uci.slice(0, 4) === pz.solution.slice(0, 4);
      dock(`<div class="verdict good"><span><b>${firstTry ? "Correct!" : "That's it."}</b> ${same ? "" : `That works too. Sage's choice was ${esc(solSan)}.`}</span><div class="row">${nextBtn()}</div></div>`);
      wireNext();
      return;
    }
    firstTry = false;
    buzz([18, 40, 30]);
    dock(`<div class="verdict bad"><span><b>Not quite.</b> Last time: ${esc(pz.why || "this move lost material.")}</span>
      <div class="row"><button class="btn btn-line btn-small" id="pagain">Try again</button><button class="btn btn-mint" id="pshow">Show answer</button></div></div>`);
    $("#pagain").onclick = () => { board.render(pos, { animate: true, interactive: true, mySide: pz.side }); dock(`<div class="verdict info">Try again. Look for checks, captures and threats.</div>`); };
    $("#pshow").onclick = () => {
      done = true; grade();
      board.render(pos, { animate: true, interactive: false, mySide: pz.side, shapes: [{ type: "arrow", from: uciFrom(pz.solution), to: uciTo(pz.solution), color: "#4FD8A4", marker: "mint" }] });
      dock(`<div class="verdict info"><span>The move was <b>${esc(solSan)}</b>. This one comes back ${practice ? "in your schedule" : "tomorrow"}.</span><div class="row">${nextBtn()}</div></div>`);
      wireNext();
    };
  }
  function finish() {
    board.render(pos, { animate: false, interactive: false, mySide: pz.side });
    dock(`<div class="verdict good"><span><b>Done.</b> ${solvedFirst} of ${list.length} solved on the first try.${practice ? "" : " Solved puzzles come back later to make sure they stick."}</span><div class="row"><button class="btn btn-gold btn-small" id="phome">Home</button></div></div>`);
    $("#phome").onclick = showHome;
  }
  load();
}

function teardownGame() {
  if (currentGame) currentGame.alive = false;
  if (currentBoard) currentBoard.destroy();
  currentGame = null; currentBoard = null;
}

async function startGame(bot, rated) {
  teardownGame();
  sound.ensure();
  const you = Profile.data.history.length % 2 === 0 ? "w" : "b";
  const rank = Profile.rank;
  app.innerHTML = `<section class="screen game-screen">
    <div class="gbar">
      <button class="icon-btn" id="leave" aria-label="Leave game">←</button>
      <span class="lbl">${rated ? "Rated game" : "Casual game"}</span><div class="spacer"></div>
      <button class="txt-btn" id="cmt" aria-label="Toggle live commentary" aria-pressed="${Profile.data.commentary}">${Profile.data.commentary ? "💬 On" : "💬 Off"}</button>
      <button class="txt-btn" id="snd" aria-label="Toggle sound">${Profile.data.sound ? "🔊" : "🔇"}</button>
      <button class="txt-btn" id="resign">⚑ Resign</button>
    </div>
    <div class="player"><span class="av">${bot.name[0]}</span><div class="meta"><div class="nm">${bot.name} <span class="muted tabnum" style="font-weight:500">${bot.rating}</span></div><div class="captured" id="cap-top"></div></div><div class="thinking" id="th-bot"><span class="dots"><i></i><i></i><i></i></span>thinking</div></div>
    <div class="board-wrap" id="bw"><div class="loading" style="position:absolute;inset:0;justify-content:center"><div class="spinner"></div><span>Waking up the engine…</span></div></div>
    <div class="player"><span class="av">${goldSvg(rank.piece)}</span><div class="meta"><div class="nm">You <span class="muted tabnum" style="font-weight:500">${rank.name} · ${Profile.data.rating}</span></div><div class="captured" id="cap-bot"></div></div><div class="thinking" id="th-you"><span class="dots"><i></i><i></i><i></i></span>checking</div></div>
    <div class="moves" id="moves"></div>
    <div class="dock" id="dock"><div class="status">Setting up the board…</div></div>
  </section>`;
  $("#leave").onclick = () => confirmLeave();
  $("#resign").onclick = () => confirmLeave();
  $("#cmt").onclick = (e) => {
    Profile.data.commentary = !Profile.data.commentary; Profile.saveLocal();
    e.currentTarget.textContent = Profile.data.commentary ? "💬 On" : "💬 Off";
    e.currentTarget.setAttribute("aria-pressed", Profile.data.commentary);
    if (currentGame && currentBoard) renderGame(currentGame, currentBoard, bot, rated);
  };
  $("#snd").onclick = (e) => { Profile.data.sound = !Profile.data.sound; Profile.saveLocal(); e.currentTarget.textContent = Profile.data.sound ? "🔊" : "🔇"; };

  let engine;
  try { engine = await Engine.start(); }
  catch (e) {
    $("#bw").innerHTML = `<div class="loading" style="position:absolute;inset:0;justify-content:center"><span style="color:var(--coral);font-weight:700">The engine couldn't start.</span><span>${esc(e.message || e)}. Check your connection, then try again.</span><button class="btn btn-line" id="again" style="width:auto;padding:0 20px">Try again</button></div>`;
    $("#again").onclick = () => startGame(bot, rated);
    return;
  }
  if (!document.body.contains($("#bw"))) return;
  const wrap = $("#bw");
  wrap.innerHTML = "";
  const board = new BoardView(wrap, {
    onMove: (uci) => { sound.move(!!game.position.pieceAt(uciTo(uci))); game.playYourMove(uci); },
    onTap: (sq) => game.answerQuiz(sq),
  });
  board.setOrientation(you);
  const game = new Game({ engine, bot, rank, you, onChange: (g) => renderGame(g, board, bot, rated) });
  game.onMistake = (p) => Profile.addPuzzle(p);
  currentGame = game; currentBoard = board;
  game.rated = rated;
  board.render(game.position, { animate: false, mySide: you });
  game.start().catch((e) => toast("Something went wrong: " + (e.message || e)));
}

function capturedHTML(pos, side) {
  const start = { p: 8, n: 2, b: 2, r: 2, q: 1 };
  const have = { p: 0, n: 0, b: 0, r: 0, q: 0 };
  for (const p of Object.values(pos.pieces())) if (p.side === opp(side) && have[p.kind] != null) have[p.kind]++;
  let html = "";
  for (const k of ["q", "r", "b", "n", "p"]) for (let i = 0; i < Math.max(0, start[k] - have[k]); i++) html += pieceSvg(opp(side), k);
  const adv = balance(pos, side);
  return html + (adv > 0 ? `<span class="adv">+${adv}</span>` : "");
}

function renderGame(g, board, bot, rated) {
  if (g !== currentGame) return;
  const shown = g.pausedPosition || g.position;
  const paused = g.phase === "paused";
  const shapes = [];
  if (paused && g.report && g.message) {
    const r = g.report, m = g.message;
    if (m.showThreat && r.replyUci) shapes.push({ type: "arrow", from: uciFrom(r.replyUci), to: uciTo(r.replyUci), color: "#FF6B5E", marker: "coral" });
    if (r.square && explainsWhy(g.rank)) shapes.push({ type: "ring", sq: r.square, color: "#FF6B5E" });
    if (m.showBest && m.better && r.bestUci) shapes.push({ type: "arrow", from: uciFrom(r.bestUci), to: uciTo(r.bestUci), color: "#4FD8A4", marker: "mint" });
  }
  if (g.phase === "yourTurn" && g.hint.length) for (const sq of g.hint) shapes.push({ type: "ring", sq, color: "#E8B954" });
  board.render(shown, {
    animate: true,
    lastMove: g.pausedMove || g.lastMove,
    interactive: g.phase === "yourTurn",
    mySide: g.you,
    dim: paused,
    shapes,
    tapMode: g.phase === "quiz",
  });
  $("#bw").classList.toggle("paused", paused);
  $("#th-bot").classList.toggle("on", g.phase === "botThinking");
  $("#th-you").classList.toggle("on", g.phase === "judging");
  $("#cap-top").innerHTML = capturedHTML(shown, opp(g.you));
  $("#cap-bot").innerHTML = capturedHTML(shown, g.you);

  const mv = $("#moves");
  let mh = "";
  for (let i = 0; i < g.sans.length; i += 2) {
    const f = (j) => (g.sans[j] ? `${esc(g.sans[j])}${g.flags[j] ? `<span class="flag ${g.flags[j].tone || "bad"}">${esc(g.flags[j].s)}</span>` : ""}` : "");
    mh += `<span><span class="n">${i / 2 + 1}.</span> ${f(i)} ${f(i + 1)}</span>`;
  }
  mv.innerHTML = mh;
  mv.scrollLeft = mv.scrollWidth;

  const dock = $("#dock");
  if (paused && g.message) {
    const m = g.message;
    const key = g.attempt + ":" + g.sans.length;
    if (dock.dataset.key !== key) {
      dock.dataset.key = key;
      dock.innerHTML = `<div class="coach" role="alert">
        <div class="who">✦ Sage</div>
        <div class="cline wrong"><span class="ic">✕</span><span>${esc(m.wrong)}</span></div>
        ${m.why ? `<div class="cline why"><span class="ic">!</span><span>${esc(m.why)}</span></div>` : ""}
        ${m.better ? `<div class="cline better"><span class="ic">✓</span><span>${esc(m.better)}</span></div>` : ""}
        <div class="actions">
          <button class="btn btn-gold btn-small" id="retry">Try again</button>
          ${givesBetterMove(g.rank) && g.report.bestSan ? `<button class="btn btn-mint" id="better">Play ${esc(g.report.bestSan)}</button>` : ""}
        </div></div>`;
      $("#retry").onclick = () => g.retry();
      const bb = $("#better");
      if (bb) bb.onclick = () => g.playBetter();
    }
  } else if (g.phase === "quiz" && g.quiz) {
    const key = "quiz:" + g.sans.length + ":" + g.quiz.attempts;
    if (dock.dataset.key !== key) {
      dock.dataset.key = key;
      dock.innerHTML = `<div class="coach quiz" role="alert">
        <div class="who">✦ Sage asks</div>
        <div class="cline ask"><span class="ic">?</span><span><b>What is ${esc(bot.name)} threatening?</b> Tap the piece of yours that's in danger.</span></div>
        ${g.note ? `<div class="cline why"><span class="ic">!</span><span>${esc(g.note.text)}</span></div>` : ""}
        <div class="actions"><button class="btn btn-line btn-small" id="reveal">I'm not sure, show me</button></div>
      </div>`;
      $("#reveal").onclick = () => g.revealQuiz();
    }
  } else {
    dock.dataset.key = "";
    const text = { starting: "Setting up the board…", yourTurn: g.position.isCheck ? "You're in check. Your move." : "Your move", judging: "Sage is checking your move…", botThinking: `${bot.name} is thinking…`, over: "Game over" }[g.phase] || "";
    const note = g.phase === "yourTurn" && g.note ? `<div class="note ${g.note.tone}">${g.note.tone === "good" ? "✓" : "✦"} ${esc(g.note.text)}</div>` : "";
    let feed = "";
    if (Profile.data.commentary && g.phase !== "starting" && g.phase !== "over" && (g.comment || g.botComment)) {
      const c = g.comment, bc = g.botComment;
      feed = `<div class="feed">
        ${c ? `<div class="fl"><span class="verdict-chip ${c.tone}">${esc(c.label)}</span><span><b>${esc(c.san)}</b>${c.text ? " · " + esc(c.text) : ""}</span></div>` : ""}
        ${bc ? `<div class="fl botline"><span class="who-chip">${esc(bot.name)}</span><span><b>${esc(bc.san)}</b>${bc.text ? " · " + esc(cap(bc.text)) + (bc.text.endsWith("!") ? "" : ".") : ""}</span></div>` : ""}
      </div>`;
    }
    dock.innerHTML = `${note}${feed}<div class="status">${text}</div>`;
  }
  if (g.phase === "over" && !g.recorded) { g.recorded = true; finishGame(g, bot, rated); }
}

async function finishGame(g, bot, rated) {
  const outcome = Profile.record({ bot, result: g.result, rated, mistakes: g.mistakes, preCoachBlunders: g.preCoachBlunders, sans: g.sans.slice(0, 300) });
  await sleep(750);
  if (g !== currentGame) return;
  if (rated && rankIdx(outcome.rankAfter) > rankIdx(outcome.rankBefore)) await showRankUp(outcome.rankBefore, outcome.rankAfter);
  showResult(g, bot, rated, outcome);
}

function showResult(g, bot, rated, o) {
  const [title, color] = {
    youMated: ["You won!", "var(--gold)"], botMated: [`Checkmate. ${bot.name} wins.`, "var(--coral)"], resigned: ["You resigned.", "var(--coral)"],
    stalemate: ["Draw by stalemate.", "var(--quiet)"], insufficient: ["Draw. Not enough pieces to mate.", "var(--quiet)"],
    repetition: ["Draw by repetition.", "var(--quiet)"], fiftyMoves: ["Draw by the 50-move rule.", "var(--quiet)"],
  }[g.end] || ["Game over", "var(--text)"];
  const delta = o.after - o.before;
  const types = [...new Set(g.mistakes)].map((t) => MT_LABEL[t]).slice(0, 3);
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-label="Game result">
    <h2 style="color:${color}">${title}</h2>
    ${rated ? `<div class="delta tabnum" id="cnt" style="color:${delta >= 0 ? "var(--gold)" : "var(--coral)"}">${o.before}</div>` : `<div class="muted">Casual game. Rating unchanged.</div>`}
    <div class="muted">${g.mistakes.length ? `Sage stepped in ${g.mistakes.length} ${g.mistakes.length === 1 ? "time" : "times"}${types.length ? ": " + types.join(", ").toLowerCase() : ""}.` : "Sage didn't need to stop you once. Clean game!"}</div>
    ${g.puzzles.length ? `<button class="btn btn-mint" id="fix" style="margin-top:10px">Fix ${g.puzzles.length === 1 ? "this mistake" : `these ${g.puzzles.length} mistakes`} now</button>` : ""}
    <button class="btn btn-gold" id="again" style="margin-top:${g.puzzles.length ? 0 : 10}px">Play again</button>
    <button class="btn btn-line" id="home">Home</button>
  </div>`;
  document.body.appendChild(scrim);
  if (rated) {
    const el = $("#cnt", scrim), t0 = performance.now();
    const tick = (t) => {
      const k = Math.min(1, (t - t0) / 1100), e = 1 - Math.pow(1 - k, 3);
      el.textContent = `${Math.round(o.before + (o.after - o.before) * e)}  ${delta >= 0 ? "+" : ""}${delta}`;
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  $("#again", scrim).onclick = () => { scrim.remove(); startGame(rated ? Profile.nextOpponent() : bot, rated); };
  $("#home", scrim).onclick = () => { scrim.remove(); showHome(); };
  const fix = $("#fix", scrim);
  if (fix) fix.onclick = () => { scrim.remove(); showPuzzles(g.puzzles.map((p) => Object.assign({}, p, { id: null })), true); };
}

function confirmLeave() {
  const g = currentGame;
  if (!g || g.phase === "over") { showHome(); return; }
  const scrim = document.createElement("div");
  scrim.className = "scrim center";
  scrim.innerHTML = `<div class="dialog" role="dialog" aria-label="Leave game">
    <h3>Resign this game?</h3>
    <p class="muted" style="margin:0">${g.rated ? "Resigning counts as a rated loss." : "This casual game will end."}</p>
    <div class="row"><button class="btn btn-line btn-small" id="keep">Keep playing</button><button class="btn btn-danger btn-small" id="go">Resign</button></div>
  </div>`;
  document.body.appendChild(scrim);
  $("#keep", scrim).onclick = () => scrim.remove();
  scrim.addEventListener("click", (e) => { if (e.target === scrim) scrim.remove(); });
  $("#go", scrim).onclick = () => { scrim.remove(); g.resign(); };
}

function showRankUp(from, to) {
  return new Promise((resolve) => {
    const div = document.createElement("div");
    div.className = "rankup";
    div.innerHTML = `<canvas></canvas>
      <div class="morph"><div class="from">${rankEmblem(from, 1, 180)}</div><div class="to">${rankEmblem(to, 1, 180)}</div></div>
      <div class="new"><span class="eyebrow">New rank</span><h2>${to.name}</h2><p style="margin:0;font-size:17px">${esc(to.tagline)}</p></div>
      <button class="btn btn-gold cont">Continue</button>`;
    document.body.appendChild(div);
    buzz([30, 60, 60]);
    const canvas = $("canvas", div), ctx = canvas.getContext("2d");
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const resize = () => { canvas.width = canvas.clientWidth * dpr; canvas.height = canvas.clientHeight * dpr; };
    resize();
    const parts = Array.from({ length: 70 }, () => ({ x: 0.5 + (Math.random() - 0.5) * 0.5, y: 0.42, vx: (Math.random() - 0.5) * 0.006, vy: -0.004 - Math.random() * 0.008, r: 1 + Math.random() * 2.6, life: 0.6 + Math.random() * 0.6 }));
    let t0 = null, raf;
    const frame = (t) => {
      if (t0 == null) t0 = t;
      const s = (t - t0) / 1000;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (s > 0.6) for (const p of parts) {
        const k = Math.min(1, (s - 0.6) / (2.4 * p.life));
        if (k >= 1) continue;
        const x = (p.x + p.vx * (s - 0.6) * 60) * canvas.width, y = (p.y + p.vy * (s - 0.6) * 60 + 0.002 * Math.pow((s - 0.6) * 4, 2)) * canvas.height;
        ctx.globalAlpha = 1 - k;
        ctx.fillStyle = "#E8B954";
        ctx.beginPath(); ctx.arc(x, y, p.r * dpr, 0, Math.PI * 2); ctx.fill();
      }
      if (s < 4.5) raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
    requestAnimationFrame(() => requestAnimationFrame(() => { $(".morph", div).classList.add("go"); div.classList.add("show"); }));
    $(".cont", div).onclick = () => { cancelAnimationFrame(raf); div.remove(); resolve(); };
  });
}

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

/* ---------------- Boot ---------------- */
(function boot() {
  if (typeof window.Chess !== "function") {
    app.innerHTML = `<div class="loading" style="height:100%;justify-content:center"><span style="color:var(--coral);font-weight:700">Couldn't load the chess rules.</span><span>Check your internet connection and reopen the page.</span></div>`;
    return;
  }
  Profile.loadLocal();
  showHome();
  Profile.connect(() => { if (!currentGame) showHome(); });
  Engine.start().catch(() => {}); // warm up the engine while you look at the home screen
})();
</script>
